name: CI/CD Pipeline

on:
  push:
    branches: [ main, development, 'feature/**' ]
  pull_request:
    branches: [ main, development, 'feature/**' ]

# Required to create releases
permissions:
  contents: write

# Prevent multiple concurrent runs of the same workflow from blocking the queue
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsoup2.4-dev libsoup-3.0-dev

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Setup Just
        uses: extractions/setup-just@v2

      - name: Run Unit Tests
        run: just test

      - name: Run Integration Tests
        run: just integration
        env:
          PUBLIC_YT_DUMMY_MODE: true
          YT_DUMMY_MODE: true
          PB_ADMIN_EMAIL: test@example.com
          PB_ADMIN_PASSWORD: test123456
          POCKETBASE_URL: http://127.0.0.1:8091

      - name: Build Web
        run: just build-web

      - name: Build Desktop Binaries
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: bun run tauri build --verbose

      - name: Upload Cross-Platform Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-binaries-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/
            src-tauri/target/release/*.exe
            src-tauri/target/release/*.msi
            src-tauri/target/release/*.dmg
            src-tauri/target/release/*.app
            src-tauri/target/release/*.deb
            src-tauri/target/release/*.rpm
          if-no-files-found: warn

  build-arch-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: archlinux:latest
    env:
      NO_STRIP: "true"
      STRIP: "true"
      LINUXDEPLOY_STRIP: "0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel webkit2gtk-4.1 libappindicator-gtk3 librsvg patchelf rustup curl wget unzip openssl npm fuse2 squashfs-tools file desktop-file-utils hicolor-icon-theme which libxcrypt-compat binutils gtk3 gdk-pixbuf2 pkgconf
          
          # Critical Fix: Force legacy directory structure for linuxdeploy-plugin-gtk
          mkdir -p /usr/lib/gdk-pixbuf-2.0/2.10.0/loaders
          gdk-pixbuf-query-loaders --update-cache || true

      - name: Setup Rust & Bun
        run: |
          rustup default stable
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> $GITHUB_PATH
          ln -s $HOME/.bun/bin/bun /usr/local/bin/bun || true
          
      - name: Install JS dependencies
        run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bun install --frozen-lockfile

      - name: Build Web
        run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bun run build

      - name: Build Tauri App (AppImage)
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          NO_STRIP: 1
        run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bun run tauri build --verbose

      - name: Upload Arch Artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-binaries-archlinux
          path: src-tauri/target/release/bundle/appimage/*.AppImage

  publish-release:
    needs: [test-and-build, build-arch-linux, build-android, build-ios, build-backend-server]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: desktop-binaries-*
          merge-multiple: true

      - name: Download mobile artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/mobile
          pattern: mobile-binaries-*
          merge-multiple: true

      - name: Download backend artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/backend
          pattern: backend-binaries-*
          merge-multiple: true

      - name: List Artifacts
        run: ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.exe
            artifacts/**/*.msi
            artifacts/**/*.dmg
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.AppImage
            artifacts/**/*.apk
            artifacts/**/*.aab
            artifacts/**/*.ipa
            artifacts/backend/*
          draft: true
          prerelease: false
          tag_name: app-v0.1.0-${{ github.run_number }}
          name: 'App Build ${{ github.run_number }}'
          body: 'Automated release containing cross-platform binaries (Desktop, Mobile, Server).'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager "ndk;26.1.10909125"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Build Android App
        env:
          NDK_HOME: ${{ steps.setup-android.outputs.sdk-path }}/ndk/26.1.10909125
        run: |
          # Initialize Android if not present
          if [ ! -d "src-tauri/gen/android" ]; then
            bun run tauri android init
          fi
          bun run tauri android build --verbose

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mobile-binaries-android
          path: src-tauri/gen/android/app/build/outputs/apk/release/*.apk

  build-ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, x86_64-apple-ios, aarch64-apple-ios-sim

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Build iOS App
        run: |
          # Initialize iOS if not present
          if [ ! -d "src-tauri/gen/apple" ]; then
            bun run tauri ios init
          fi
          bun run tauri ios build --verbose --no-bundle

      - name: Upload iOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mobile-binaries-ios
          path: src-tauri/gen/apple/build/Release-iphoneos/*.app

  build-backend-server:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Standalone Backend
        run: |
          cd src-tauri
          cargo build --release --bin app
          mv target/release/app ../yt-backend-server-linux

      - name: Upload Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-binaries-linux
          path: yt-backend-server-linux
 

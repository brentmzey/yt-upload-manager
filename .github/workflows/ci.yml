name: CI/CD Pipeline

on:
  push:
    branches: [ main, development, 'feature/**' ]
  pull_request:
    branches: [ main, development, 'feature/**' ]
  workflow_dispatch:

# Required to create releases
permissions:
  contents: write

# Prevent multiple concurrent runs of the same workflow from blocking the queue
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: JavaScript Dependency Audit
        run: |
          npm install --package-lock-only
          npm audit --audit-level=high

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Rust Dependency Audit
        run: |
          cd src-tauri
          cargo audit --ignore RUSTSEC-2020-0071 --ignore RUSTSEC-2020-0159

  test-and-build:
    needs: security-scan
    if: always() && !cancelled()
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Initialize Rustup (Fix for macOS cargo metadata bug)
        run: rustup default stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsoup2.4-dev libsoup-3.0-dev

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Setup Just
        uses: extractions/setup-just@v2

      - name: Check Environment
        run: just check-env

      - name: Run Unit Tests
        run: just test

      - name: Run Integration Tests
        run: just integration
        env:
          PUBLIC_YT_DUMMY_MODE: true
          YT_DUMMY_MODE: true
          PB_ADMIN_EMAIL: test@example.com
          PB_ADMIN_PASSWORD: test123456
          POCKETBASE_URL: http://127.0.0.1:8091

      - name: Build Web
        run: just build-web

      - name: Build Desktop Binaries
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: bun run tauri build --verbose

      - name: Upload Cross-Platform Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-binaries-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/
            src-tauri/target/release/*.exe
            src-tauri/target/release/*.msi
            src-tauri/target/release/*.dmg
            src-tauri/target/release/*.app
            src-tauri/target/release/*.deb
            src-tauri/target/release/*.rpm
          if-no-files-found: warn

  build-arch-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: archlinux:latest
    env:
      NO_STRIP: "true"
      STRIP: "true"
      LINUXDEPLOY_STRIP: "0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel webkit2gtk-4.1 libappindicator-gtk3 librsvg patchelf rustup curl wget unzip openssl npm fuse2 squashfs-tools file desktop-file-utils hicolor-icon-theme which libxcrypt-compat binutils gtk3 gdk-pixbuf2 pkgconf
          
          # Critical Fix: Force legacy directory structure for linuxdeploy-plugin-gtk
          mkdir -p /usr/lib/gdk-pixbuf-2.0/2.10.0/loaders
          gdk-pixbuf-query-loaders --update-cache || true

      - name: Setup Rust & Bun
        run: |
          rustup default stable
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> $GITHUB_PATH
          ln -s $HOME/.bun/bin/bun /usr/local/bin/bun || true
          
      - name: Install JS dependencies
        run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bun install --frozen-lockfile

      - name: Build Web
        run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bun run build

      - name: Build Tauri App (AppImage)
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          NO_STRIP: 1
        run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bun run tauri build --verbose

      - name: Upload Arch Artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-binaries-archlinux
          path: src-tauri/target/release/bundle/appimage/*.AppImage

  publish-release:
    needs: [test-and-build, build-arch-linux, build-android, build-ios, build-backend-server]
    runs-on: ubuntu-latest
    if: always() && !cancelled() && (needs.test-and-build.result == 'success' || needs.build-backend-server.result == 'success')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Artifact Directory
        run: mkdir -p artifacts-to-publish

      - name: Download Desktop Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: artifacts-to-publish
          pattern: desktop-binaries-*
          merge-multiple: true

      - name: Download Mobile Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: artifacts-to-publish/mobile
          pattern: mobile-binaries-*
          merge-multiple: true

      - name: Download Backend Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: artifacts-to-publish/backend
          pattern: backend-binaries-*
          merge-multiple: true

      - name: List Artifacts for Debugging
        run: ls -R artifacts-to-publish

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts-to-publish/**/*.exe
            artifacts-to-publish/**/*.msi
            artifacts-to-publish/**/*.dmg
            artifacts-to-publish/**/*.deb
            artifacts-to-publish/**/*.rpm
            artifacts-to-publish/**/*.AppImage
            artifacts-to-publish/**/*.apk
            artifacts-to-publish/**/*.aab
            artifacts-to-publish/**/*.ipa
            artifacts-to-publish/backend/*
            artifacts-to-publish/yt-backend-server-linux
          draft: false
          prerelease: false
          generate_release_notes: true
          tag_name: v0.1.0-build-${{ github.run_number }}
          name: 'Release Build ${{ github.run_number }}'
          body: |
            ## Automated Multi-Facet Build
            This release contains artifacts from the latest CI/CD run.
            
            ### Included Facets:
            - **Desktop**: Windows, macOS, Linux (AppImage/Deb/Rpm)
            - **Server**: Standalone Linux Backend
            - **Mobile**: Android (APK) and iOS (if successful)
            
            *Note: Some artifacts may be missing if specific platform builds encountered issues.*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        id: setup-android

      - name: Install Android NDK
        run: sdkmanager "ndk;26.1.10909125"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Build Android App
        run: |
          # Use the NDK provided by the runner if possible, or fall back to the one we installed
          export NDK_HOME=$ANDROID_HOME/ndk/$(ls $ANDROID_HOME/ndk | head -1)
          echo "Using NDK at $NDK_HOME"
          # Initialize Android non-interactively
          if [ ! -d "src-tauri/gen/android" ]; then
            bun run tauri android init --ci
          fi
          bun run tauri android build --verbose --apk --ci

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mobile-binaries-android
          path: src-tauri/gen/android/app/build/outputs/apk/release/*.apk

  build-ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, x86_64-apple-ios, aarch64-apple-ios-sim

      - name: Initialize Rustup
        run: rustup default stable

      - name: Setup Just
        uses: extractions/setup-just@v2

      - name: Check Environment
        run: just check-env

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Build iOS App
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM || '0000000000' }}
          CODE_SIGNING_ALLOWED: NO
          CODE_SIGNING_REQUIRED: NO
          CODE_SIGN_IDENTITY: ""
          CODE_SIGN_ENTITLEMENTS: ""
        run: |
          # Initialize iOS if not present
          if [ ! -d "src-tauri/gen/apple" ]; then
            # Provide dummy team ID to satisfy init if secret is missing
            bun run tauri ios init --ci
          fi
          # Pre-build web frontend so the Xcode bundle assets are up to date
          bun run build
          # Create dummy dev-server address file to bypass Tauri CLI panic in CI/CD environments
          echo "http://127.0.0.1:4321" > "${TMPDIR:-/tmp}/com.yt-upload-manager.desktop-server-addr"
          # Compile the iOS application directly via xcodebuild targeting the simulator (no Apple developer account or signing required)
          xcodebuild -quiet -scheme app_iOS -workspace src-tauri/gen/apple/app.xcodeproj/project.xcworkspace/ -sdk iphonesimulator -configuration Release CODE_SIGN_STYLE=Manual CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" PROVISIONING_PROFILE_SPECIFIER="" PROVISIONING_PROFILE="" CONFIGURATION_BUILD_DIR=src-tauri/gen/apple/build/Release-iphonesimulator CONFIGURATION=Release build


      - name: Upload iOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mobile-binaries-ios
          path: src-tauri/gen/apple/build/*/*.app

  build-backend-server:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsoup2.4-dev libsoup-3.0-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Standalone Backend
        run: |
          cd src-tauri
          cargo build --release --bin app
          mv target/release/app ../yt-backend-server-linux

      - name: Upload Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-binaries-linux
          path: yt-backend-server-linux
 

name: CI/CD Pipeline

on:
  push:
    branches: [ main, development, 'feature/**' ]
  pull_request:
    branches: [ main, development, 'feature/**' ]

# Required to create releases
permissions:
  contents: write

# Prevent multiple concurrent runs of the same workflow from blocking the queue
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        timeout-minutes: 5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        timeout-minutes: 5
        with:
          node-version: 22.12.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        timeout-minutes: 5
        with:
          bun-version: latest
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        timeout-minutes: 10

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        timeout-minutes: 5

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-latest'
        timeout-minutes: 20
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsoup2.4-dev libsoup-3.0-dev

      - name: Install JS dependencies
        timeout-minutes: 10
        run: bun install --frozen-lockfile

      - name: Setup Just
        uses: extractions/setup-just@v2
        timeout-minutes: 5

      - name: Run Unit Tests
        timeout-minutes: 10
        run: just test

      - name: Run Integration Tests
        timeout-minutes: 15
        run: just integration
        env:
          PUBLIC_YT_DUMMY_MODE: true
          YT_DUMMY_MODE: true
          PB_ADMIN_EMAIL: test@example.com
          PB_ADMIN_PASSWORD: test123456
          POCKETBASE_URL: http://127.0.0.1:8091

      - name: Build Web
        timeout-minutes: 10
        run: just build-web

      - name: Build Desktop Binaries
        uses: tauri-apps/tauri-action@v0
        timeout-minutes: 30
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fix for AppImage bundling in environments without FUSE
          APPIMAGE_EXTRACT_AND_RUN: 1
        with:
          tagName: app-v__VERSION__
          releaseName: 'App v__VERSION__'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: true
          prerelease: false

      - name: Upload Cross-Platform Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-binaries-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/
            src-tauri/target/release/*.exe
            src-tauri/target/release/*.dmg
            src-tauri/target/release/*.app
            src-tauri/target/release/*.deb
            src-tauri/target/release/*.rpm
          if-no-files-found: warn

  # Specialized Arch Linux Build
  build-arch-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: archlinux:latest
    env:
      NO_STRIP: "true"
      STRIP: "true"
      LINUXDEPLOY_STRIP: "0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        timeout-minutes: 5

      - name: Install System Dependencies
        timeout-minutes: 15
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel webkit2gtk-4.1 libappindicator-gtk3 librsvg patchelf rustup curl wget unzip openssl npm fuse2 squashfs-tools file desktop-file-utils hicolor-icon-theme which libxcrypt-compat binutils gtk3 gdk-pixbuf2
          gdk-pixbuf-query-loaders --update-cache

      - name: Setup Rust & Bun
        timeout-minutes: 10
        run: |
          rustup default stable
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> $GITHUB_PATH
          ln -s $HOME/.bun/bin/bun /usr/local/bin/bun || true
          
      - name: Install JS dependencies
        timeout-minutes: 10
        run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bun install --frozen-lockfile

      - name: Build Web
        timeout-minutes: 10
        run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bun run build

      - name: Build Tauri App (AppImage)
        timeout-minutes: 20
        run: |
          export PATH="$HOME/.bun/bin:$PATH"
          export APPIMAGE_EXTRACT_AND_RUN=1
          
          # Arch Linux specific fix for gdk-pixbuf directory structure expected by linuxdeploy-plugin-gtk
          # Scan entire /usr for the loaders directory to be 100% sure.
          echo "🔍 Searching for GDK Pixbuf loaders..."
          LOADERS_DIR=$(find /usr -name loaders -path "*gdk-pixbuf-2.0*" -type d -print -quit)
          
          if [ -n "$LOADERS_DIR" ]; then
            FOUND_DIR=$(dirname "$LOADERS_DIR")
            EXPECTED_DIR="/usr/lib/gdk-pixbuf-2.0/2.10.0"
            echo "✅ Found GDK Pixbuf dir at $FOUND_DIR"
            if [ "$FOUND_DIR" != "$EXPECTED_DIR" ]; then
              echo "🔗 Symlinking $FOUND_DIR to $EXPECTED_DIR"
              mkdir -p $(dirname "$EXPECTED_DIR")
              ln -sf "$FOUND_DIR" "$EXPECTED_DIR"
            fi
          else
             echo "⚠️  Loaders not found via find, trying pkg-config..."
             PKG_DIR=$(pkg-config --variable=gdk_pixbuf_binarydir gdk-pixbuf-2.0 2>/dev/null || echo "")
             if [ -n "$PKG_DIR" ] && [ -d "$PKG_DIR" ]; then
                echo "✅ Found via pkg-config: $PKG_DIR"
                mkdir -p /usr/lib/gdk-pixbuf-2.0
                ln -sf "$PKG_DIR" "/usr/lib/gdk-pixbuf-2.0/2.10.0"
             else
                echo "❌ CRITICAL: GDK Pixbuf loaders not found! Printing /usr/lib/gdk-pixbuf-2.0 contents:"
                ls -R /usr/lib/gdk-pixbuf-2.0 || echo "Directory does not exist"
             fi
          fi

          export NO_STRIP=1
          bun run tauri build --verbose
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: arch-linux-bundle
          path: src-tauri/target/release/bundle/
          timeout-minutes: 5
 
